name: Build and Deploy

on:
  push:
    branches:
      - main # prod
      - test
    # don't deploy on non code changes
    paths-ignore:
      - 'README.md'
      - '**/README.md'

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    # use correct github vars & secrets environemtns based on branch
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

      # needed at build time for entrypoint script
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'test' }}

      # needed at build time for database url
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main branch → latest
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            # test branch → test
            type=raw,value=test,enable=${{ github.ref_name == 'test' }}
            # always include a SHA tag for traceability
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@db:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
            ENV=${{ env.ENV }}
          provenance: false

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Cleanup old GHCR image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: false

  deploy:
    needs: [build]
    runs-on: self-hosted

    # use correct github vars & secrets environemtns based on branch
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'test' }}

    env:
      PROXY_NET: "nathan_default"
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'test' }}

      # needed to get correct compose file
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'test' }}

      # needed by compose to create db container
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}

    steps:

      - name: Deploy container
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.${{ env.ENV }}.yml \
            up -d --force-recreate

      - name: Connect App container to proxy network (prod only)
        if: env.ENV == 'prod'
        run: docker network connect ${PROXY_NET} hangman-app-prod

      - name: Cleanup unused images
        run: docker image prune -f
