name: Deploy App

on:
  push:
    branches:
      - main # prod
      - test
    # don't deploy on non code changes
    paths-ignore:
      - 'README.md'
      - '**/README.md'

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    # use correct github vars & secrets environemtns based on branch
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    
    env:
      PROXY_NET: "nathan_default"
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

      # need to be set at build time
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/my-app
          tags: |
            type=ref,event=branch
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DATABASE_URL=postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@db:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
            ENV=${{ env.ENV }}
          provenance: false

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Deploy containers
        run: |
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.${ENV}.yml \
            stop
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.${ENV}.yml \
            rm --force
          docker compose \
            -f docker-compose.base.yml \
            -f docker-compose.${ENV}.yml \
            up -d --remove-orphans

      - name: Connect App container to proxy network (prod only)
        if: env.ENV == 'prod'
        run: docker network connect ${PROXY_NET} hangman-app-prod

      - name: Cleanup unused images
        run: docker image prune -f
